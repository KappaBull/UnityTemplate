name: Unity Build

on:
  push:
    branches:
      - main
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test Runner (EditMode + PlayMode)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-Tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-Tests-
            Library-${{ runner.os }}-

      - name: Install Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://unity.com/install.sh | UNITY_CLI_CHANNEL=beta bash
          echo "$HOME/.unity/bin" >> "$GITHUB_PATH"
          "$HOME/.unity/bin/unity" --version

      - name: Install GameCI CLI
        id: gameci
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/game-ci/cli/v0.1.72/scripts/install.sh \
            | bash -s -- v0.1.72 "$RUNNER_TEMP/game-ci/bin"
          echo "$RUNNER_TEMP/game-ci/bin" >> "$GITHUB_PATH"

      - name: Activate Unity Personal license
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${UNITY_EMAIL:-}" || -z "${UNITY_PASSWORD:-}" ]]; then
            echo "::error::UNITY_EMAIL and UNITY_PASSWORD secrets are required"
            exit 1
          fi
          game-ci activate . --targetPlatform StandaloneOSX --unityLicensingMethod personal

      - name: Run EditMode tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          unity test . \
            --mode EditMode \
            --report-format junit \
            --output TestResults/editmode.xml \
            --allow-install \
            --timeout 1200 \
            --non-interactive \
            -- -nographics

      - name: Run PlayMode tests
        shell: bash
        run: |
          set -euo pipefail
          unity test . \
            --mode PlayMode \
            --report-format junit \
            --output TestResults/playmode.xml \
            --timeout 1200 \
            --non-interactive

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-${{ github.run_number }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Return Unity license
        if: always() && steps.gameci.outcome == 'success'
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: game-ci return-license . --targetPlatform StandaloneOSX --unityLicensingMethod personal

  build-macos:
    name: Build and smoke test StandaloneOSX
    needs: test-macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-StandaloneOSX-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-StandaloneOSX-
            Library-${{ runner.os }}-

      - name: Build project with Production scheme
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.72
          targetPlatform: StandaloneOSX
          buildMethod: BuildCI.BuildClientCMD
          customParameters: -buildMagicScheme Production
          cacheUnityInstallationOnMac: true

      - name: Smoke test built player
        shell: bash
        run: |
          set -euo pipefail
          player_app="$(find Build-StandaloneOSX -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$player_app" ]]; then
            echo "::error::StandaloneOSX .app bundle was not produced"
            exit 1
          fi

          player_bin="$(find "$player_app/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          if [[ -z "$player_bin" ]]; then
            echo "::error::Executable was not found in $player_app"
            exit 1
          fi

          player_log="$RUNNER_TEMP/unity-player.log"
          "$player_bin" -batchmode -logFile "$player_log" &
          player_pid=$!
          cleanup() {
            kill "$player_pid" 2>/dev/null || true
            wait "$player_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 15
          if ! kill -0 "$player_pid" 2>/dev/null; then
            echo "::error::Built player exited during startup"
            test ! -f "$player_log" || cat "$player_log"
            exit 1
          fi
          if [[ ! -s "$player_log" ]]; then
            echo "::error::Built player produced no startup log"
            exit 1
          fi
          if grep -Eiq 'Crash!!!|Aborting batchmode due to failure|Failed to initialize|(^|[[:space:]])[[:alnum:]_.]*Exception:|Assertion failed|Shader error' "$player_log"; then
            echo "::error::Built player reported a startup failure"
            cat "$player_log"
            exit 1
          fi
          cat "$player_log"

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: StandaloneOSX-${{ github.run_number }}
          path: |
            Build-StandaloneOSX
            ${{ runner.temp }}/unity-player.log
          if-no-files-found: error
          retention-days: 14
