name: Unity Build

on:
  push:
    branches:
      - main
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-personal
  cancel-in-progress: false
  queue: max

jobs:
  test-macos:
    name: Test Runner (Editor + Production Player)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-Tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-Tests-
            Library-${{ runner.os }}-

      - name: Install Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://unity.com/install.sh | UNITY_CLI_CHANNEL=beta bash
          echo "$HOME/.unity/bin" >> "$GITHUB_PATH"
          "$HOME/.unity/bin/unity" --version

      - name: Install GameCI CLI
        id: gameci
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/game-ci/cli/v0.1.72/scripts/install.sh \
            | bash -s -- v0.1.72 "$RUNNER_TEMP/game-ci/bin"
          echo "$RUNNER_TEMP/game-ci/bin" >> "$GITHUB_PATH"

      - name: Activate Unity Personal license
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${UNITY_EMAIL:-}" || -z "${UNITY_PASSWORD:-}" ]]; then
            echo "::error::UNITY_EMAIL and UNITY_PASSWORD secrets are required"
            exit 1
          fi
          game-ci activate . --targetPlatform StandaloneOSX --unityLicensingMethod personal

      - name: Run EditMode tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          unity test . \
            --mode EditMode \
            --report-format nunit,junit \
            --output TestResults/editmode.xml \
            --junit-output TestResults/editmode-junit.xml \
            --allow-install \
            --timeout 1200 \
            --non-interactive \
            -- -nographics

      - name: Run PlayMode tests
        shell: bash
        run: |
          set -euo pipefail
          unity test . \
            --mode PlayMode \
            --report-format nunit,junit \
            --output TestResults/playmode.xml \
            --junit-output TestResults/playmode-junit.xml \
            --timeout 1200 \
            --non-interactive

      - name: Validate Editor test reports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for mode in ("editmode", "playmode"):
              result = ET.parse(Path("TestResults", mode + ".xml")).getroot()
              assert result.tag == "test-run", result.tag
              assert result.get("result") == "Passed", result.attrib
              total = int(result.get("total", "0"))
              assert total > 0, f"No {mode} tests ran"
              assert int(result.get("passed", "0")) == total, result.attrib
              assert int(result.get("failed", "0")) == 0, result.attrib
              assert int(result.get("skipped", "0")) == 0, result.attrib
              print(f"{mode}: {total} tests passed")
          PY

      - name: Run Production Player tests
        shell: bash
        run: |
          set -euo pipefail
          unity_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | tr -d '\r')"
          editor_root="$(unity editors path "$unity_version" --quiet --no-banner)"
          editor="$editor_root/Unity.app/Contents/MacOS/Unity"
          if [[ ! -x "$editor" ]]; then
            echo "::error::Unity Editor executable was not found"
            exit 1
          fi
          "$editor" -batchmode -projectPath "$GITHUB_WORKSPACE" \
            -runTests -testPlatform StandaloneOSX \
            -testCategory ProductionPlayer -productionPlayerTests \
            -buildPlayerPath "$RUNNER_TEMP/ProductionPlayerTests" \
            -logFile TestResults/production-player-editor.log
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          app = Path(os.environ["RUNNER_TEMP"], "ProductionPlayerTests", "PlayerWithTests", "PlayerWithTests.app")
          with (app / "Contents" / "Info.plist").open("rb") as info:
              executable = plistlib.load(info).get("CFBundleExecutable")
          if not isinstance(executable, str) or executable in ("", ".", "..") or "/" in executable or "\\" in executable:
              raise ValueError("Invalid CFBundleExecutable in test player bundle")
          player = app / "Contents" / "MacOS" / executable
          if not player.is_file():
              raise FileNotFoundError(f"Test player executable was not produced: {player}")
          report = Path("TestResults/production-player.xml").resolve()
          log = Path("TestResults/production-player.log").resolve()
          env = dict(os.environ, UNITY_TEMPLATE_PLAYER_RESULTS=str(report))
          subprocess.run([str(player), "-batchmode", "-logFile", str(log)],
                         env=env, check=True, timeout=180)
          result = ET.parse(report).getroot()
          assert result.get("result") == "Passed", result.attrib
          assert int(result.get("total", "0")) > 0, "No Production Player tests ran"
          assert int(result.get("failed", "0")) == 0, result.attrib
          assert int(result.get("skipped", "0")) == 0, result.attrib
          print(f"Production Player: {result.get('passed')} tests passed")
          PY
          if grep -Eiq 'Crash!!!|Aborting batchmode due to failure|Failed to initialize|(^|[[:space:]])[[:alnum:]_.]*Exception:|Assertion failed|Shader error' TestResults/production-player.log; then
            echo "::error::Production test player reported a runtime failure"
            cat TestResults/production-player.log
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-${{ github.run_number }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Return Unity license
        if: always() && steps.gameci.outcome == 'success'
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: game-ci return-license . --targetPlatform StandaloneOSX --unityLicensingMethod personal

  build-player:
    name: ${{ matrix.checkName }}
    needs: test-macos
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - targetPlatform: StandaloneOSX
            checkName: Build and smoke test StandaloneOSX
          - targetPlatform: Android
            checkName: Build Android package (no device tests)
          - targetPlatform: iOS
            checkName: Export iOS Xcode project (no device tests)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ matrix.targetPlatform }}-

      - name: Build project with Production scheme
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.72
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: BuildCI.BuildClientCMD
          customParameters: -buildMagicScheme Production
          cacheUnityInstallationOnMac: true

      - name: Verify mobile output
        if: matrix.targetPlatform != 'StandaloneOSX'
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.targetPlatform }}
        run: |
          set -euo pipefail
          case "$TARGET_PLATFORM" in
            Android)
              package="$(find Build-Android -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)"
              if [[ -z "$package" || ! -s "$package" ]]; then
                echo "::error::Android package was not produced"
                exit 1
              fi
              ;;
            iOS)
              test -s Build-iOS/Unity-iPhone.xcodeproj/project.pbxproj
              test -s Build-iOS/Info.plist
              ;;
            *) exit 1 ;;
          esac

      - name: Smoke test built player
        if: matrix.targetPlatform == 'StandaloneOSX'
        shell: bash
        run: |
          set -euo pipefail
          player_app="$(find Build-StandaloneOSX -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$player_app" ]]; then
            echo "::error::StandaloneOSX .app bundle was not produced"
            exit 1
          fi

          player_bin="$(find "$player_app/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          if [[ -z "$player_bin" ]]; then
            echo "::error::Executable was not found in $player_app"
            exit 1
          fi

          player_log="$RUNNER_TEMP/unity-player.log"
          "$player_bin" -batchmode -logFile "$player_log" &
          player_pid=$!
          cleanup() {
            kill "$player_pid" 2>/dev/null || true
            wait "$player_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 15
          if ! kill -0 "$player_pid" 2>/dev/null; then
            echo "::error::Built player exited during startup"
            test ! -f "$player_log" || cat "$player_log"
            exit 1
          fi
          if [[ ! -s "$player_log" ]]; then
            echo "::error::Built player produced no startup log"
            exit 1
          fi
          if grep -Eiq 'Crash!!!|Aborting batchmode due to failure|Failed to initialize|(^|[[:space:]])[[:alnum:]_.]*Exception:|Assertion failed|Shader error' "$player_log"; then
            echo "::error::Built player reported a startup failure"
            cat "$player_log"
            exit 1
          fi
          cat "$player_log"

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.targetPlatform }}-${{ github.run_number }}
          path: |
            Build-${{ matrix.targetPlatform }}
            ${{ runner.temp }}/unity-player.log
          if-no-files-found: error
          retention-days: 14

  required-checks:
    name: Unity required checks
    if: always()
    needs: [test-macos, build-player, test-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test-macos.result }}
          BUILD_RESULT: ${{ needs.build-player.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
        run: |
          set -euo pipefail
          for result in "$TEST_RESULT" "$BUILD_RESULT" "$WINDOWS_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "::error::A required Unity job did not succeed ($result)"
              exit 1
            fi
          done

  test-windows:
    name: Windows IL2CPP Player and production startup
    needs: build-player
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-ProductionPlayer-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-ProductionPlayer-

      - name: Install Unity CLI and Windows IL2CPP Editor
        env:
          UNITY_CLI_CHANNEL: beta
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'install-unity.ps1'
          Invoke-WebRequest https://unity.com/install.ps1 -OutFile $installer
          & $installer
          $unity = Join-Path $env:LOCALAPPDATA 'Unity/bin/unity.exe'
          $version = (Select-String -Path ProjectSettings/ProjectVersion.txt -Pattern '^m_EditorVersion: (.+)$').Matches[0].Groups[1].Value.Trim()
          & $unity install $version --module windows-il2cpp --yes --accept-eula --non-interactive
          if ($LASTEXITCODE -ne 0) { throw 'Unity Editor installation failed' }
          $editorRoot = (& $unity editors path $version --quiet --no-banner | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $editorRoot 'Editor/Unity.exe'))) {
            throw 'Windows Unity Editor was not found'
          }
          "UNITY_PATH=$editorRoot" >> $env:GITHUB_ENV

      - name: Download pinned GameCI native licensing scripts
        id: licensing
        run: |
          $ErrorActionPreference = 'Stop'
          $steps = Join-Path $env:RUNNER_TEMP 'gameci-windows-licensing'
          New-Item -ItemType Directory -Force -Path $steps | Out-Null
          foreach ($name in @('activate.ps1', 'return_license.ps1', 'resolve_unity_path.ps1', 'licensing_method.ps1')) {
            Invoke-WebRequest "https://raw.githubusercontent.com/game-ci/cli/7da0cea2f31799a4cbd79c1d452c254023f4f678/dist/platforms/windows/steps/$name" -OutFile (Join-Path $steps $name)
          }
          # WindowsのGUI実行ファイルは、関数内でパイプしないと終了を待たず古い終了コードを返す。
          $resolver = Join-Path $steps 'resolve_unity_path.ps1'
          $source = Get-Content -LiteralPath $resolver -Raw
          $launch = '(?m)^    & \$ExePath @Arguments\r?$'
          if ([regex]::Matches($source, $launch).Count -ne 1) {
            throw 'Pinned GameCI launch implementation changed'
          }
          Set-Content -LiteralPath $resolver -Value ([regex]::Replace($source, $launch, '    & $ExePath @Arguments | Out-Host')) -Encoding utf8
          $scratch = Join-Path $env:RUNNER_TEMP 'unity-license-project'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          "STEPS_DIR=$steps" >> $env:GITHUB_ENV
          "ACTIVATE_LICENSE_PATH=$scratch" >> $env:GITHUB_ENV
          'UNITY_LICENSING_METHOD=personal' >> $env:GITHUB_ENV

      - name: Activate Unity Personal license
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if (-not $env:UNITY_EMAIL -or -not $env:UNITY_PASSWORD) { throw 'Unity account secrets are required' }
          & (Join-Path $env:STEPS_DIR 'activate.ps1')
          if ($global:UNITY_EXIT_CODE -ne 0) { throw 'Unity Personal activation failed' }

      - name: Build and run Production IL2CPP Player tests
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          $editor = Join-Path $env:UNITY_PATH 'Editor/Unity.exe'
          $buildRoot = Join-Path $env:RUNNER_TEMP 'ProductionPlayerTests'
          & $editor -batchmode -projectPath $env:GITHUB_WORKSPACE -buildTarget Win64 -runTests -testPlatform StandaloneWindows64 -testCategory ProductionPlayer -productionPlayerTests -buildPlayerPath $buildRoot -logFile TestResults/production-player-editor.log | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Production IL2CPP test Player build failed' }
          $players = @(Get-ChildItem -Path $buildRoot -Recurse -Filter PlayerWithTests.exe -File)
          if ($players.Count -ne 1) { throw 'Expected exactly one test Player executable' }
          $env:UNITY_TEMPLATE_PLAYER_RESULTS = Join-Path $env:GITHUB_WORKSPACE 'TestResults/production-player.xml'
          $playerLog = Join-Path $env:GITHUB_WORKSPACE 'TestResults/production-player.log'
          $player = Start-Process -FilePath $players[0].FullName -ArgumentList @('-batchmode', '-logFile', "`"$playerLog`"") -PassThru -WindowStyle Hidden
          try {
            if (-not $player.WaitForExit(180000)) { throw 'Production test Player timed out' }
            if ($player.ExitCode -ne 0) { throw "Test Player failed with exit code $($player.ExitCode)" }
          } finally {
            if (-not $player.HasExited) { $player.Kill(); $player.WaitForExit() }
          }
          [xml]$report = Get-Content -LiteralPath $env:UNITY_TEMPLATE_PLAYER_RESULTS -Raw
          $result = $report.DocumentElement
          if ($result.result -ne 'Passed' -or [int]$result.total -le 0 -or
              [int]$result.passed -ne [int]$result.total -or [int]$result.failed -ne 0 -or [int]$result.skipped -ne 0) {
            throw 'Production test results were missing, failed, or skipped'
          }
          if (-not (Test-Path $playerLog) -or (Get-Item $playerLog).Length -eq 0) { throw 'No test Player log' }
          if (Select-String -LiteralPath $playerLog -Pattern 'Crash!!!|Aborting batchmode due to failure|Failed to initialize|(^|\s)[\w.]*Exception:|Assertion failed|Shader error' -Quiet) {
            throw 'Production test Player reported a runtime error'
          }
          Write-Host "Windows Production IL2CPP Player: $($result.passed) tests passed"

      - name: Build production application and verify startup
        run: |
          $ErrorActionPreference = 'Stop'
          $editor = Join-Path $env:UNITY_PATH 'Editor/Unity.exe'
          & $editor -batchmode -nographics -projectPath $env:GITHUB_WORKSPACE -buildTarget Win64 -executeMethod BuildCI.BuildClientCMD -buildMagicScheme Production -logFile TestResults/production-build.log | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows IL2CPP production build failed' }
          $players = @(Get-ChildItem -Path Build-StandaloneWindows64 -Filter *.exe -File | Where-Object Name -NotMatch '^UnityCrashHandler')
          if ($players.Count -ne 1) { throw 'Expected exactly one production executable' }
          $playerLog = Join-Path $env:GITHUB_WORKSPACE 'TestResults/production-startup.log'
          $player = Start-Process -FilePath $players[0].FullName -ArgumentList @('-batchmode', '-logFile', "`"$playerLog`"") -PassThru -WindowStyle Hidden
          try {
            if ($player.WaitForExit(15000)) { throw 'Windows production Player exited during startup' }
            if (-not (Test-Path $playerLog) -or (Get-Item $playerLog).Length -eq 0) { throw 'No production startup log' }
            if (Select-String -LiteralPath $playerLog -Pattern 'Crash!!!|Aborting batchmode due to failure|Failed to initialize|(^|\s)[\w.]*Exception:|Assertion failed|Shader error' -Quiet) {
              throw 'Windows production Player reported a startup error'
            }
            Get-Content -LiteralPath $playerLog
          } finally {
            if (-not $player.HasExited) { $player.Kill(); $player.WaitForExit() }
          }

      - name: Return Unity Personal license
        if: always() && steps.licensing.outcome == 'success'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          . (Join-Path $env:STEPS_DIR 'return_license.ps1')
          if ($null -eq $ReturnExitCode -or $ReturnExitCode -ne 0) { throw 'Unity license return was not confirmed' }

      - name: Upload Windows test results and build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-IL2CPP-${{ github.run_number }}
          path: |
            TestResults
            Build-StandaloneWindows64
          if-no-files-found: warn
          retention-days: 14
